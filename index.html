<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Cw3_2</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div>

    <div>
      <h1>Cw 1</h1>
      <p>Lista stacji</p>
      <button id="cw1">Wypisz stacje</button>
      <div id="cw1t" class="res">
      </div>
    </div>

    <div>
      <h1>Cw 2</h1>
      <p>Lista kategorii lokalizacji</p>
      <button id="cw2">Wypisz kategorie</button>
      <div id="cw2t" class="res">
      </div>
    </div>

    <div>
      <h1>Cw 3</h1>
      <p>Lista stacji</p>
      <table>
        <tr>
          <td>Limit danych:</td>
          <td>
            <input type="number" id="cw3l" value="20" min="1" max="100">
          </td>
        </tr>
        <tr>
          <td>Data początkowa:</td>
          <td>
            <input type="date" id="cw3di">
          </td>
        </tr>
        <tr>
          <td>Data końcowa:</td>
          <td>
            <input type="date" id="cw3dx">
          </td>
        </tr>
        <tr>
          <td>
            <button id="cw3">Wypisz stacje</button>
          </td>
        </tr>
      </table>
      <div id="cw3t" class="res">
      </div>
    </div>

  </div>
  <script src="script.js"></script>
</body>

</html>
